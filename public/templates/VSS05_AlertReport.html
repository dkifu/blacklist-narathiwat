<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Phuket Eyes – สร้างรูปรายงานประจำวัน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f5fa; --card:#ffffff; --ink:#0f1b3d; --muted:#5b678a; --line:#d9deec;
  --accent:#1e5bd8; --accent-ink:#ffffff; --warn-bg:#fff4d6; --warn-ink:#6a4a00; --ok:#0f7a3d;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0a1122; --card:#111b35; --ink:#e8edfb; --muted:#93a0c4; --line:#22305a;
    --accent:#3b7bff; --accent-ink:#fff; --warn-bg:#3a2e0c; --warn-ink:#ffd98a; --ok:#4cd98a;
  }
}
:root[data-theme="dark"]{
  --bg:#0a1122; --card:#111b35; --ink:#e8edfb; --muted:#93a0c4; --line:#22305a;
  --accent:#3b7bff; --accent-ink:#fff; --warn-bg:#3a2e0c; --warn-ink:#ffd98a; --ok:#4cd98a;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans Thai","Leelawadee UI",Tahoma,"Thonburi",sans-serif;line-height:1.5}
.wrap{max-width:1500px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 2px}
.sub{color:var(--muted);font-size:14px;margin:0 0 14px}
.grid{display:grid;grid-template-columns:minmax(300px,420px) 1fr;gap:16px;align-items:start}
@media (max-width:900px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
label.t{display:block;font-weight:600;font-size:14px;margin-bottom:6px}
textarea{width:100%;height:420px;resize:vertical;border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;font-size:14px;background:transparent;color:var(--ink)}
@media (max-width:900px){textarea{height:300px}}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
button,.filebtn{font:inherit;font-size:14px;border:1px solid var(--line);background:transparent;color:var(--ink);padding:8px 12px;border-radius:9px;cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
button:hover,.filebtn:hover{filter:brightness(1.08)}
.filebtn input{display:none}
.warn{background:var(--warn-bg);color:var(--warn-ink);border-radius:10px;padding:8px 12px;font-size:13px;margin-top:10px;display:none}
.warn ul{margin:4px 0 0;padding-left:18px}
.msg{font-size:13px;color:var(--ok);min-height:20px;margin-top:8px}
.preview{overflow:auto}
.preview img{display:block;width:100%;height:auto;border-radius:10px;background:#050d24}
.hint{color:var(--muted);font-size:12.5px;margin-top:8px}

[hidden]{display:none!important}
.grid{grid-template-columns:minmax(360px,540px) 1fr}
@media (max-width:900px){.grid{grid-template-columns:1fr}}
input,select{color-scheme:light dark}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tab{flex:1;padding:8px 10px;border-radius:9px;border:1px solid var(--line);background:transparent;font-weight:600}
.tab.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.top-actions{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.formscroll{margin-top:10px}
@media (min-width:901px){.formscroll{max-height:calc(100vh - 230px);overflow:auto;padding-right:6px}}
.sec{border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:12px}
.sec>h3{font-size:15px;margin:0 0 8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.sec>h3 .cnt{background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:0 10px;font-size:13px}
.f{display:block;margin-bottom:8px}
.f>span{display:block;font-size:12.5px;color:var(--muted);margin-bottom:2px}
.f input{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--ink);font:inherit;font-size:14px}
.f input.bad{border-color:#e0424b;background:rgba(224,66,75,.08)}
.f input:focus{outline:2px solid var(--accent);outline-offset:0}
.two{display:grid;grid-template-columns:1.3fr 1fr;gap:8px}
.three{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.item{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:10px;background:rgba(127,140,180,.06)}
.ihead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.sbox{border-top:1px dashed var(--line);margin-top:6px;padding-top:8px}
.sbox>.lab{font-size:13px;font-weight:600;margin-bottom:6px}
.srow{border:1px solid var(--line);border-radius:9px;padding:8px;margin-bottom:8px;position:relative}
.srow .n{display:inline-flex;width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:12px;align-items:center;justify-content:center;margin-right:6px}
.srow .r1{display:flex;align-items:center;margin-bottom:6px}
.srow .r1 .f{flex:1;margin:0}
.srow .r2{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end}
.srow .r2 .f{margin:0}
.small{padding:5px 9px;font-size:13px}
button.danger{background:#e0424b;border-color:#e0424b;color:#fff}
.note{font-size:12.5px;color:var(--muted);margin:2px 0 8px}

/* สีการ์ดแต่ละส่วน (โทนอ่อน) */
.sec-info{--sbg:#eef7ef;--sbd:#c3dfc9;--sacc:#2e8b57}
.sec-title{--sbg:#454611;--sbd:#d6cbee;--sacc:#6a4fc0}
.sec-face{--sbg:#eaf1ff;--sbd:#c0d3f6;--sacc:#1e5bd8}
.sec-lpr{--sbg:#fdeeee;--sbd:#f2c6c8;--sacc:#c0303a}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .sec-info{--sbg:#11291c;--sbd:#2a5a40;--sacc:#4cc98a}
  :root:not([data-theme="light"]) .sec-face{--sbg:#10214a;--sbd:#28448a;--sacc:#5b8fff}
  :root:not([data-theme="light"]) .sec-lpr{--sbg:#2b1418;--sbd:#70303a;--sacc:#ff7780}
}
:root[data-theme="dark"] .sec-info{--sbg:#11291c;--sbd:#2a5a40;--sacc:#4cc98a}
:root[data-theme="dark"] .sec-face{--sbg:#10214a;--sbd:#28448a;--sacc:#5b8fff}
:root[data-theme="dark"] .sec-lpr{--sbg:#2b1418;--sbd:#70303a;--sacc:#ff7780}
.sec{background:var(--sbg,transparent);border-color:var(--sbd,var(--line));border-left:5px solid var(--sacc,var(--line))}
.sec>h3 .cnt{background:var(--sacc,var(--accent))}
.sec .item{background:color-mix(in srgb,var(--card) 72%,transparent);border-color:var(--sbd,var(--line))}
.sec .srow{border-color:var(--sbd,var(--line));background:color-mix(in srgb,var(--card) 60%,transparent)}
.sec .srow .n{background:var(--sacc,var(--accent))}
.sec .f input{background:var(--card)}
.sec .sbox{border-top-color:var(--sbd,var(--line))}
.sec button.small:not(.danger){border-color:var(--sacc,var(--line));color:var(--ink)}

.photo{display:flex;gap:10px;align-items:center;border:1px dashed var(--sbd,var(--line));border-radius:9px;padding:8px;margin-bottom:8px;background:color-mix(in srgb,var(--card) 60%,transparent)}
.photo:focus,.photo.drag{outline:2px solid var(--sacc,var(--accent))}
.photo .thumb{width:104px;height:68px;object-fit:contain;background:#0b1430;border-radius:6px;flex:none}
.photo .ph{width:104px;height:68px;flex:none;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--muted);border:1px dashed var(--line);border-radius:6px}
.photo .side{flex:1;min-width:0}
.photo .tip{font-size:12px;color:var(--muted);margin-bottom:6px}
.photo .btns2{display:flex;gap:6px;flex-wrap:wrap}
</style>
</head>
<body>
<div class="wrap">
  <h1>Phuket Eyes – สร้างรูปรายงานประจำวัน</h1>
  <p class="sub">กรอกข้อมูลในฟอร์มด้านซ้าย รูปจะสร้างให้อัตโนมัติทันที</p>
  <div class="grid">
    <div class="card">
      <div class="top-actions">
        <button class="primary" id="btnSave">บันทึกเป็นรูป PNG</button>
        <button id="btnCopy">คัดลอกรูป</button>
        <label class="filebtn">อัปโหลดตราตำรวจ (ซ้าย)<input type="file" id="logo" accept="image/*"></label>
        <label class="filebtn">อัปโหลดโลโก้ (ขวา)<input type="file" id="logoR" accept="image/*"></label>
      </div>
      <div class="msg" id="msg"></div>
      <div class="warn" id="warn"></div>

      <div id="paneForm" class="formscroll">
        <div id="form"></div>
      </div>

      <div class="hint">ถ้าปุ่มบันทึกใช้ไม่ได้ ให้กดค้าง (มือถือ) หรือคลิกขวา (คอม) ที่รูปแล้วเลือก “บันทึกรูปภาพ”</div>
      <datalist id="dl-owner"></datalist><datalist id="dl-type"></datalist>
      <datalist id="dl-place"></datalist><datalist id="dl-prov"></datalist>
    </div>
    <div class="card preview">
      <img id="out" alt="รูปรายงาน Phuket Eyes">
    </div>
  </div>
</div>

<script>
const countEvents = s => s.items.reduce((a,i)=>a+Math.max(1,i.sightings.length),0);

/* ================= เวลา ================= */
function timeFull(raw){
  if(!raw) return '-';
  let s = raw.trim().replace(/(\d{1,2})[.:](\d{2})\s*\.?\s*น?\.?\s*$/,'$1:$2 น.');
  if(!/^วันที่/.test(s)) s = 'วันที่ '+s;
  return s;
}
function timeShort(raw){
  if(!raw) return '-';
  return timeFull(raw).replace(/^วันที่\s*/,'').replace(/\s*เวลา\s*/,' ');
}

/* ================= วาดรูป (canvas) ================= */
const cv = document.createElement('canvas');
const ctx = cv.getContext('2d');
const F = '"Noto Sans Thai","Leelawadee UI","Sarabun",Tahoma,"Thonburi",sans-serif';
const W = 1600;
let DRY = false, logoImg = null;
const seg = (typeof Intl!=='undefined' && Intl.Segmenter) ? new Intl.Segmenter('th',{granularity:'word'}) : null;

const GOLD='#ffc21a', BLUE='#1e5bd8', RED='#b3121c', MUTED='#d3dbf2';

function setF(w,s){ ctx.font = `${w} ${s}px ${F}`; }
function T(s,x,y,o={}){
  if(DRY) return;
  setF(o.w||400,o.s||24); ctx.fillStyle=o.c||'#fff'; ctx.textAlign=o.a||'left'; ctx.fillText(s,x,y);
}
function mw(s,w,sz){ setF(w,sz); return ctx.measureText(s).width; }
function wrap(t,maxW){
  const toks = seg ? [...seg.segment(t)].map(s=>s.segment) : t.split(/(\s+)/);
  const lines=[]; let cur='';
  for(const k of toks){
    const test = cur+k;
    if(ctx.measureText(test).width>maxW && cur.trim()){ lines.push(cur.trimEnd()); cur=k.trimStart(); }
    else cur=test;
  }
  if(cur.trim()) lines.push(cur.trimEnd());
  return lines.length?lines:[''];
}
function fitSize(parts,maxW,start,min){
  for(let s=start;s>=min;s--){
    const w = parts.reduce((a,p)=>a+mw(p[0],p[1],s),0);
    if(w<=maxW) return s;
  }
  return min;
}
function rr(x,y,w,h,r){
  ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}

/* ไอคอน */
const ic = {
  shield(cx,cy,s){
    ctx.beginPath(); ctx.moveTo(cx,cy-s); ctx.lineTo(cx+s*.85,cy-s*.6); ctx.lineTo(cx+s*.85,cy+s*.1);
    ctx.quadraticCurveTo(cx+s*.8,cy+s*.75,cx,cy+s); ctx.quadraticCurveTo(cx-s*.8,cy+s*.75,cx-s*.85,cy+s*.1);
    ctx.lineTo(cx-s*.85,cy-s*.6); ctx.closePath(); ctx.stroke();
    ctx.beginPath(); ctx.arc(cx,cy,s*.22,0,7); ctx.fillStyle='#cbd5f0'; ctx.fill();
  },
  doc(cx,cy,s){
    ctx.strokeRect(cx-s*.7,cy-s,s*1.4,s*2);
    ctx.beginPath(); for(const k of [-.45,0,.45]){ctx.moveTo(cx-s*.4,cy+s*k);ctx.lineTo(cx+s*.4,cy+s*k);} ctx.stroke();
  },
  pin(cx,cy,s){
    ctx.beginPath(); ctx.moveTo(cx,cy+s); ctx.bezierCurveTo(cx-s*1.2,cy-s*.2,cx-s*.9,cy-s,cx,cy-s);
    ctx.bezierCurveTo(cx+s*.9,cy-s,cx+s*1.2,cy-s*.2,cx,cy+s); ctx.stroke();
    ctx.beginPath(); ctx.arc(cx,cy-s*.25,s*.32,0,7); ctx.stroke();
  },
  clock(cx,cy,s){
    ctx.beginPath(); ctx.arc(cx,cy,s,0,7); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx,cy-s*.6); ctx.lineTo(cx,cy); ctx.lineTo(cx+s*.5,cy+s*.3); ctx.stroke();
  },
  face(cx,cy,s){
    const c=s*.55, l=s*1.05;
    ctx.beginPath();
    for(const [sx,sy] of [[-1,-1],[1,-1],[1,1],[-1,1]]){
      ctx.moveTo(cx+sx*l,cy+sy*(l-c)); ctx.lineTo(cx+sx*l,cy+sy*l); ctx.lineTo(cx+sx*(l-c),cy+sy*l);
    } ctx.stroke();
    ctx.beginPath(); ctx.arc(cx,cy-s*.15,s*.38,0,7); ctx.stroke();
    ctx.beginPath(); ctx.arc(cx,cy+s*.85,s*.55,Math.PI*1.15,Math.PI*1.85); ctx.stroke();
  },
  car(cx,cy,s){
    // กรอบมุมสี่เหลี่ยมแบบเดียวกับไอคอน face
    const c=s*.55, l=s*1.05;
    ctx.beginPath();
    for(const [sx,sy] of [[-1,-1],[1,-1],[1,1],[-1,1]]){
      ctx.moveTo(cx+sx*l,cy+sy*(l-c)); ctx.lineTo(cx+sx*l,cy+sy*l); ctx.lineTo(cx+sx*(l-c),cy+sy*l);
    } ctx.stroke();
    // รถขนาดเล็กอยู่ตรงกลางกรอบ
    const k=.6, y=cy+s*.05;
    rr(cx-s*1.1*k,y-s*.1*k,s*2.2*k,s*.85*k,s*.25*k); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx-s*.75*k,y-s*.1*k); ctx.lineTo(cx-s*.5*k,y-s*.7*k); ctx.lineTo(cx+s*.5*k,y-s*.7*k); ctx.lineTo(cx+s*.75*k,y-s*.1*k); ctx.stroke();
    for(const q of [-.6,.6]){ ctx.beginPath(); ctx.arc(cx+s*q*k,y+s*.8*k,s*.22*k,0,7); ctx.stroke(); }
  },
  siren(cx,cy,s){
    ctx.beginPath(); ctx.arc(cx,cy,s*.8,Math.PI,0); ctx.lineTo(cx+s*.8,cy+s*.5); ctx.lineTo(cx-s*.8,cy+s*.5); ctx.closePath(); ctx.fill();
    ctx.fillRect(cx-s*1.1,cy+s*.6,s*2.2,s*.35);
    ctx.lineWidth=3; ctx.beginPath();
    ctx.moveTo(cx,cy-s*1.35); ctx.lineTo(cx,cy-s*1.05);
    ctx.moveTo(cx-s*1.15,cy-s*.9); ctx.lineTo(cx-s*.9,cy-s*.7);
    ctx.moveTo(cx+s*1.15,cy-s*.9); ctx.lineTo(cx+s*.9,cy-s*.7); ctx.stroke();
  },
  eye(cx,cy,s){
    ctx.beginPath(); ctx.moveTo(cx-s*1.6,cy); ctx.quadraticCurveTo(cx,cy-s*1.6,cx+s*1.6,cy);
    ctx.quadraticCurveTo(cx,cy+s*1.6,cx-s*1.6,cy); ctx.stroke();
    ctx.beginPath(); ctx.arc(cx,cy,s*.62,0,7); ctx.stroke();
    ctx.beginPath(); ctx.arc(cx,cy,s*.25,0,7); ctx.fill();
  },
  calendar(cx,cy,s){
    rr(cx-s,cy-s*.8,s*2,s*1.8,3); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx-s,cy-s*.2); ctx.lineTo(cx+s,cy-s*.2);
    ctx.moveTo(cx-s*.5,cy-s*1.1); ctx.lineTo(cx-s*.5,cy-s*.6); ctx.moveTo(cx+s*.5,cy-s*1.1); ctx.lineTo(cx+s*.5,cy-s*.6); ctx.stroke();
  }
};
function icon(name,cx,cy,s,color,lw=2){
  if(DRY) return;
  ctx.save(); ctx.strokeStyle=color; ctx.fillStyle=color; ctx.lineWidth=lw; ctx.lineCap='round'; ctx.lineJoin='round';
  ic[name](cx,cy,s); ctx.restore();
}

/* แถวข้อมูล */
function row(iconName,label,val,x,y,w,rp=0){
  setF(500,24);
  const lines = wrap(val||'-', w-236-30-rp);
  const h = Math.max(46, lines.length*33+13);
  if(!DRY){
    icon(iconName,x+44,y+23,13,'#cbd5f0',2);
    T(label,x+78,y+31,{s:24,c:MUTED});
    T(':',x+214,y+31,{c:MUTED});
    lines.forEach((l,i)=>T(l,x+236,y+31+i*33,{s:24,w:500}));
    ctx.strokeStyle='rgba(120,150,220,.28)'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(x+30,y+h); ctx.lineTo(x+w-30-rp,y+h); ctx.stroke();
  }
  return h;
}

function badge(x,y,n,color){
  if(DRY) return;
  ctx.fillStyle=color; ctx.beginPath();
  ctx.moveTo(x,y); ctx.lineTo(x+58,y); ctx.lineTo(x+46,y+44); ctx.lineTo(x,y+44); ctx.closePath(); ctx.fill();
  T(String(n),x+24,y+33,{s:28,w:800,a:'center'});
}

function drawItems(items,x,y,w,accent){
  if(!items.length){
    T('ไม่มีเหตุการณ์แจ้งเตือน',x+w/2,y+56,{s:26,c:MUTED,a:'center'});
    return 100;
  }
  let cy = y+16;
  items.forEach((it,idx)=>{
    if(idx>0){
      if(!DRY){ ctx.strokeStyle='rgba(120,160,240,.45)'; ctx.lineWidth=1.5; ctx.beginPath(); ctx.moveTo(x+14,cy); ctx.lineTo(x+w-14,cy); ctx.stroke(); }
      cy += 16;
    }
    // รูปประกอบ (ถ้ามี) วางชิดขวาของหัวรายการ
    let iw=0, ih=0;
    if(it.img){
      const r=it.img.width/it.img.height;
      ih=96; iw=ih*r;
      if(iw>190){ iw=190; ih=iw/r; }
      iw=Math.round(iw); ih=Math.round(ih);
      if(!DRY){
        const ix=x+w-30-iw, iy=cy+2;
        ctx.save(); rr(ix,iy,iw,ih,8); ctx.clip(); ctx.drawImage(it.img,ix,iy,iw,ih); ctx.restore();
        ctx.strokeStyle=accent; ctx.lineWidth=2.5; rr(ix,iy,iw,ih,8); ctx.stroke();
      }
    }
    const imgBottom = cy+2+ih;
    const rpAt = yy => (iw && yy<imgBottom-4) ? iw+24 : 0;
    setF(800,32);
    const title = it.title.toUpperCase();
    const tl = wrap(title, w-100-26-(iw?iw+20:0));
    badge(x+26,cy+2,idx+1,accent);
    tl.forEach((ln,i)=>T(ln,x+100,cy+34+i*40,{s:32,w:800,c:GOLD}));
    cy += Math.max(50, tl.length*40+8) + 6;

    cy += row('shield','เจ้าของคดี',it.owner||'-',x,cy,w,rpAt(cy));
    cy += row('doc','ประเภทคดี',it.type||'-',x,cy,w,rpAt(cy));

    const s = it.sightings.length ? it.sightings : [{place:'',time:''}];
    {
      cy += row('pin','จุดพบเหตุ',`พบทั้งหมด ${s.length} ครั้ง`,x,cy,w,rpAt(cy));
      s.forEach((p,i)=>{
        const tt = timeShort(p.time);
        setF(500,23);
        const tw = ctx.measureText(tt).width;
        const lines = wrap(p.place||'-', w-78-30-tw-20-rpAt(cy));
        const h = Math.max(44, lines.length*32+12);
        if(!DRY){
          ctx.fillStyle=accent; ctx.beginPath(); ctx.arc(x+44,y0(cy)+22,13,0,7); ctx.fill();
          T(String(i+1),x+44,cy+28,{s:16,w:700,a:'center'});
          lines.forEach((l,k)=>T(l,x+78,cy+30+k*32,{s:23,w:500}));
          T(tt,x+w-30-rpAt(cy),cy+30,{s:23,w:600,c:'#ffe08a',a:'right'});
          ctx.strokeStyle='rgba(120,150,220,.2)'; ctx.lineWidth=1;
          ctx.beginPath(); ctx.moveTo(x+30,cy+h); ctx.lineTo(x+w-30,cy+h); ctx.stroke();
        }
        cy += h;
      });
    }
    cy = Math.max(cy, imgBottom+6);
    cy += 8;
  });
  return cy - y + 8;
}

function panelHeader(x,y,w,kind,count){
  const face = kind==='face';
  const g = ctx.createLinearGradient(x,y,x,y+72);
  g.addColorStop(0, face?'#1f5fd6':'#c21520'); g.addColorStop(1, face?'#123a8f':'#7a0c14');
  ctx.fillStyle=g; ctx.fillRect(x,y,w,72);
  icon(face?'face':'car',x+64,y+36,17,'#fff',2.5);
  const title = face?'ระบบตรวจจับใบหน้า (Face ID)':'ระบบตรวจจับป้ายทะเบียน (LPR)';
  T(title,x+112,y+46,{s:32,w:700});
  const tw = mw(title,700,32);
  T(String(count),x+112+tw+16,y+48,{s:38,w:800,c:GOLD});
  const nw = mw(String(count),800,38);

function star(cx,cy,R,r,color){
  ctx.beginPath();
  for(let i=0;i<10;i++){
    const a=-Math.PI/2+i*Math.PI/5, rad=i%2?r:R;
    ctx.lineTo(cx+Math.cos(a)*rad,cy+Math.sin(a)*rad);
  }
  ctx.closePath(); ctx.fillStyle=color; ctx.fill();
}
let logoR=null;
// ขนาดกรอบโลโก้ ใช้ร่วมกันทั้งซ้ายและขวา ให้ออกมาเท่ากัน
const LOGO_W=144, LOGO_H=172, LOGO_PAD=8;
function logoPlate(img,cx,cy){
  const ratio=img.width/img.height;
  let ih=LOGO_H-LOGO_PAD*2, iw=ih*ratio;
  if(iw>LOGO_W-LOGO_PAD*2){ iw=LOGO_W-LOGO_PAD*2; ih=iw/ratio; }
  ctx.save(); ctx.fillStyle='#ffffff'; rr(cx-LOGO_W/2,cy-LOGO_H/2,LOGO_W,LOGO_H,14); ctx.fill();
  ctx.drawImage(img,cx-iw/2,cy-ih/2,iw,ih); ctx.restore();
}
function logoRight(cx,cy){ if(logoR) logoPlate(logoR,cx,cy); }
function emblem(cx,cy,r){
  ctx.save();
  if(logoImg){
    // แสดงทั้งภาพ คงสัดส่วน ไม่ตัด บนแผ่นพื้นขาว (ให้สีขาวในตราไม่หาย)
    ctx.restore();
    logoPlate(logoImg,cx,cy);
    return;
  }
  ctx.beginPath(); ctx.arc(cx,cy,r,0,7); ctx.fillStyle='#0b1e4a'; ctx.fill();
  ctx.strokeStyle=GOLD; ctx.lineWidth=4; ctx.stroke();
  ctx.beginPath(); ctx.arc(cx,cy,r*.72,0,7); ctx.strokeStyle='#e0a91b'; ctx.lineWidth=2; ctx.stroke();
  star(cx,cy,r*.55,r*.27,GOLD);
  ctx.beginPath(); ctx.arc(cx,cy,r*.13,0,7); ctx.fillStyle='#0b1e4a'; ctx.fill();
  ctx.restore();
}

function render(){
  const d = buildFromState();
  const faceN = d.face.count ?? countEvents(d.face);
  const lprN  = d.lpr.count  ?? countEvents(d.lpr);
  const total = d.total ?? (faceN+lprN);

  const PX1=40, PX2=810, PW=750, PT=372, HH=72;
  DRY = true;
  const hL = drawItems(d.face.items,PX1,PT+HH,PW,BLUE);
  const hR = drawItems(d.lpr.items,PX2,PT+HH,PW,RED);
  const panelH = HH + Math.max(hL,hR) + 16;
  const H = PT + panelH + 30;

  cv.width = W; cv.height = H; DRY = false;
  ctx.textBaseline='alphabetic';

  /* พื้นหลัง */
  let g = ctx.createLinearGradient(0,0,W,H);
  g.addColorStop(0,'#050d26'); g.addColorStop(.55,'#0a1a44'); g.addColorStop(1,'#050d26');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='rgba(80,120,220,.06)'; ctx.lineWidth=1;
  for(let i=0;i<W;i+=48){ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i,H);ctx.stroke();}

  /* หัวเรื่อง */
  emblem(110,106,66);
  const L1=(TITLE.l1||'').trim(), L2=(TITLE.l2||'').trim(), L3=(TITLE.l3||'').trim();
  const TMAX = 1330-210;                    // พื้นที่ข้อความก่อนถึงโลโก้ขวา
  if(L1) T(L1,210,62,{s:fitSize([[L1,700]],TMAX,40,22),w:700});
  if(L2){
    const ts = fitSize([[L2,800]],TMAX,84,36);
    setF(800,ts);
    const tg=ctx.createLinearGradient(0,90,0,150); tg.addColorStop(0,'#ffffff'); tg.addColorStop(1,'#aeb8cc');
    ctx.fillStyle=tg; ctx.textAlign='left'; ctx.fillText(L2,210,140);
  }
  if(L3) T(L3,212,182,{s:fitSize([[L3,500]],TMAX,26,14),w:500,c:'#4d8dff'});
  logoRight(1480,106);

  /* กล่องข้อมูลวันที่ */
  const IX=40, IW=820, IY=214, IH=138;
  ctx.fillStyle='rgba(8,22,60,.85)'; rr(IX,IY,IW,IH,16); ctx.fill();
  ctx.strokeStyle='rgba(120,160,240,.55)'; ctx.lineWidth=2; rr(IX,IY,IW,IH,16); ctx.stroke();
  const date = d.reportDate || '-';
  const l1 = [['รายงานสถิติการแจ้งเตือน ',700],['ประจำวันที่ '+date,800]];
  const rg = d.range;
  // [ข้อความ, น้ำหนัก, สี] ช่วงวันเวลาเป็นสีเหลืองเดียวกับวันที่รายงาน
  const l2 = rg ? [['สถิติตั้งแต่ ',500],[`วันที่ ${rg.d1} เวลา ${rg.t1} ถึง วันที่ ${rg.d2} เวลา ${rg.t2}`,700,GOLD]]
                : [['สถิติ -',500]];
  const maxTxt = IW-110-24;
  const sz = Math.min(fitSize(l1,maxTxt,30,14), fitSize(l2,maxTxt,30,14));
  // วันที่ใหญ่กว่าข้อความรอบข้างราว 2 ขนาด (ลดลงเองถ้าบรรทัดยาวเกิน)
  let dsz = sz+6;
  while(dsz>sz && mw(l1[0][0],700,sz)+mw(l1[1][0],800,dsz)>maxTxt) dsz--;
  icon('calendar',IX+38,IY+48,15,'#cbd5f0',2);
  T(l1[0][0],IX+70,IY+58,{s:sz,w:700});
  T(l1[1][0],IX+70+mw(l1[0][0],700,sz),IY+60,{s:dsz,w:800,c:GOLD});
  icon('clock',IX+38,IY+104,15,'#cbd5f0',2);
  let lx=IX+70;
  l2.forEach(([t,w,c])=>{ T(t,lx,IY+114,{s:sz,w,c:c||'#fff'}); lx+=mw(t,w,sz); });

  /* กล่องสรุป */
  const SX=876, SW=684, SY=214, SH=138;
  g = ctx.createLinearGradient(SX,SY,SX+SW,SY+SH);
  g.addColorStop(0,'#c21520'); g.addColorStop(1,'#6d0a12');
  ctx.fillStyle=g; rr(SX,SY,SW,SH,16); ctx.fill();
  ctx.strokeStyle='rgba(255,120,120,.6)'; ctx.lineWidth=2; rr(SX,SY,SW,SH,16); ctx.stroke();
  const DIV = SX+290;                       // เส้นแบ่งซ้าย/ขวา
  ctx.strokeStyle='rgba(255,255,255,.25)'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.moveTo(DIV,SY+14); ctx.lineTo(DIV,SY+SH-14); ctx.stroke();
  // ฝั่งซ้าย: จำนวนรวม
  icon('siren',SX+36,SY+82,16,'#ffd15c',2);
  const LX = SX+68, LW = DIV-LX-12;
  const lsz = fitSize([['แจ้งเหตุทั้งสิ้น',700]],LW,24,12);
  T('แจ้งเหตุทั้งสิ้น',LX,SY+38,{s:lsz,w:700});
  const tot = String(total);
  let ns = 100; while(ns>44 && mw(tot,800,ns)>LW*0.5) ns-=4;
  T(tot,LX,SY+SH-16,{s:ns,w:800,c:GOLD});
  const nwid = mw(tot,800,ns)+12;
  const es = fitSize([['เหตุการณ์',700]],LW-nwid,32,14);
  T('เหตุการณ์',LX+nwid,SY+SH-26,{s:es,w:700});
  // ฝั่งขวา: สรุปแยกระบบ
  const RX = DIV+16, RW = SX+SW-16-RX;
  T('สรุปสถิติการแจ้งเตือน',RX,SY+34,{s:fitSize([['สรุปสถิติการแจ้งเตือน',700]],RW,24,14),w:700});
  [['face','ตรวจจับใบหน้า (Face ID)',faceN,SY+46],['car','ตรวจจับป้ายทะเบียน (LPR)',lprN,SY+92]].forEach(([ico,lab,n,yy])=>{
    ctx.fillStyle='rgba(20,6,12,.55)'; rr(RX,yy,RW,38,8); ctx.fill();
    icon(ico,RX+22,yy+19,9,'#fff',2);
    const nTxt=String(n), unit='เหตุการณ์';
    const grp = mw(nTxt,800,24)+6+mw(unit,500,14);
    const ly = fitSize([[lab,500]],RW-44-grp-18,17,11);
    T(lab,RX+42,yy+25,{s:ly,w:500});
    T(unit,RX+RW-12,yy+25,{s:14,w:500,a:'right',c:'#f1d6d6'});
    T(nTxt,RX+RW-12-mw(unit,500,14)-6,yy+28,{s:24,w:800,c:GOLD,a:'right'});
  });

  /* แผง */
  [[PX1,'face',BLUE,d.face,faceN],[PX2,'lpr',RED,d.lpr,lprN]].forEach(([px,kind,col,sec,n])=>{
    ctx.fillStyle='rgba(6,18,50,.92)'; rr(px,PT,PW,panelH,16); ctx.fill();
    ctx.save(); rr(px,PT,PW,panelH,16); ctx.clip(); panelHeader(px,PT,PW,kind,n); ctx.restore();
    ctx.strokeStyle = kind==='face'?'#2f6bea':'#d1202b'; ctx.lineWidth=2.5; rr(px,PT,PW,panelH,16); ctx.stroke();
    drawItems(sec.items,px,PT+HH,PW,col);
  });

  $('out').src = cv.toDataURL('image/png');

  /* คำเตือน */
  const w = formWarnings();
  const box=$('warn');
  if(w.length){ box.style.display='block'; box.innerHTML='<b>ตรวจสอบก่อนส่ง:</b><ul>'+w.map(x=>'<li>'+x.replace(/</g,'&lt;')+'</li>').join('')+'</ul>'; }
  else box.style.display='none';
}

$('btnSave').onclick = async ()=>{
  render();

    if(downloads){ await downloads.save({filename:name,data:blob}); say('บันทึกรูปแล้ว'); return; }

};

let storedLogo=null;
try{ storedLogo=localStorage.getItem('pe_logo'); }catch(e){}
setLogo(storedLogo || DEFAULT_LOGO);
$('logo').addEventListener('change',e=>{
  const f=e.target.files[0]; if(!f) return;
  const fr=new FileReader();
  fr.onload=()=>{
    const im=new Image();
    im.onload=()=>{
      const s=Math.min(1,320/Math.max(im.width,im.height));
      const c=document.createElement('canvas'); c.width=Math.round(im.width*s); c.height=Math.round(im.height*s);
      c.getContext('2d').drawImage(im,0,0,c.width,c.height);
      const url=c.toDataURL('image/png');
      try{ localStorage.setItem('pe_logo',url); }catch(err){}
      setLogo(url); say('เปลี่ยนตราแล้ว');
    };
    im.src=fr.result;
  };
  fr.readAsDataURL(f);

$('logoR').addEventListener('change',e=>{
  const f=e.target.files[0]; if(!f) return;
  const fr=new FileReader();
  fr.onload=()=>{ const im=new Image(); im.onload=()=>{
      const s=Math.min(1,400/Math.max(im.width,im.height));
      const c=document.createElement('canvas'); c.width=Math.round(im.width*s); c.height=Math.round(im.height*s);
      const g=c.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,c.width,c.height); g.drawImage(im,0,0,c.width,c.height);
      const url=c.toDataURL('image/jpeg',0.9);
      try{ localStorage.setItem('pe_logo_r',url); }catch(err){}
      setLogoR(url); say('เปลี่ยนโลโก้ขวาแล้ว'); }; im.src=fr.result; };
  fr.readAsDataURL(f);
});

let S=null, reqEls=[];
const MONTHS=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const MONTHS_FULL=['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
const p2=n=>String(n).padStart(2,'0');
const isoOf=dt=>dt.getFullYear()+'-'+p2(dt.getMonth()+1)+'-'+p2(dt.getDate());
function addDays(iso,n){ const [y,m,d]=iso.split('-').map(Number); return isoOf(new Date(y,m-1,d+n)); }
function thaiDate(iso){ if(!iso) return ''; const [y,m,d]=iso.split('-').map(Number); return `${d} ${MONTHS[m-1]} ${y+543}`; }

const SEED = {
  owner:['สภ.เมืองภูเก็ต','สภ.ตลาดเหนือ','สภ.วิชิต','สภ.ฉลอง','สภ.กะทู้','สภ.ป่าตอง','สภ.กมลา','สภ.ถลาง','สภ.เชิงทะเล','สภ.ท่าฉัตรไชย','สภ.ป่าคลอก','สภ.ราไวย์','ตม.'],
  type:['ลักทรัพย์','ฉ้อโกง','ความผิดฐานฉ้อโกง','ทำร้ายร่างกาย','รถสูญหาย','เช่ารถแล้วไม่คืน','บุคคลอยู่เกินกำหนด','เล่นพนัน'],
  place:['ประตูทางออกขาลงเครื่องภายในประเทศ','ประตูทางออกรับกระเป๋าสนามบิน INTER','ประตูทางออกขาลงเครื่อง','หน้าโรงเรียนนาบอน','สามแยกหน้าวัดเทพฯ','ขาออกก่อนถึงด่านท่าฉัตรไชย','ขาเข้าถึงด่านท่าฉัตรไชย','แยกบ่อปลาตากแดดขาไปกะทู้','แยกบ่อปลาตากแดดขาไปเซนทรัลภูเก็ต','สวนนกขาไปฉลอง'],
  prov:['ภูเก็ต','พังงา','กระบี่','สุราษฎร์ธานี','นครศรีธรรมราช','ตรัง','สงขลา','ระนอง','ชุมพร','กรุงเทพมหานคร','นนทบุรี','ปทุมธานี','สมุทรปราการ','ชลบุรี','เชียงใหม่','ขอนแก่น','นครราชสีมา']
};
const LIST_KIND={'dl-owner':'owner','dl-type':'type','dl-place':'place','dl-prov':'prov'};
let HIST={owner:[],type:[],place:[],prov:[]};
try{ const h=JSON.parse(localStorage.getItem('pe_hist')||'null'); if(h) HIST=Object.assign(HIST,h); }catch(e){}
function fillLists(){
  for(const [id,k] of Object.entries(LIST_KIND)){
    const el=$(id); if(!el) continue;
    const all=[...new Set([...(HIST[k]||[]),...SEED[k]])];
    el.innerHTML=''; all.forEach(v=>{const o=document.createElement('option'); o.value=v; el.appendChild(o);});
  }
}
function remember(id,val){
  const k=LIST_KIND[id]; val=(val||'').trim(); if(!k||!val) return;
  if(SEED[k].includes(val)||HIST[k].includes(val)) return;
  HIST[k].unshift(val); HIST[k]=HIST[k].slice(0,100);
  try{ localStorage.setItem('pe_hist',JSON.stringify(HIST)); }catch(e){}
  fillLists();
}

function newSight(prev){ return {place:prev?prev.place:'', d:prev?prev.d:(S?S.end.d:''), t:''}; }
function newItem(kind){
  return kind==='face' ? {name:'',owner:'',type:'',s:[newSight()]}
                       : {plate:'',prov:'ภูเก็ต',owner:'',type:'',s:[newSight()]};
}
function newState(){
  const t=isoOf(new Date());
  return {reportDate:t, start:{d:addDays(t,-1),t:'08:30'}, end:{d:t,t:'09:30'}, face:[], lpr:[], savedAt:Date.now()};
}
let saveT=null;
function saveDraft(){
  clearTimeout(saveT);
  saveT=setTimeout(()=>{ try{ S.savedAt=Date.now(); localStorage.setItem('pe_draft',JSON.stringify(S,(k,v)=>k[0]==='_'?undefined:v)); }catch(e){} },400);
}
function loadDraft(){
  try{
    const d=JSON.parse(localStorage.getItem('pe_draft')||'null');
    if(d && d.reportDate && Date.now()-d.savedAt < 18*3600*1000) return d;
  }catch(e){}
  return null;
}

/* แปลงข้อมูลฟอร์ม -> โครงเดียวกับที่ parser ให้ (ใช้วาดรูปร่วมกัน) */
function sightRaw(x){
  const t=(x.t||'').trim();
  if(x.d){
    const [y,m,d]=x.d.split('-').map(Number);
    const ds=`${p2(d)}/${p2(m)}/${String(y+543).slice(-2)}`;
    return t ? `วันที่ ${ds} เวลา ${t} น.` : `วันที่ ${ds}`;
  }
  return t ? `${t} น.` : '';
}
function sortedSights(list){
  const key=x=>(x.d&&x.t)?x.d+'T'+x.t:'9999';
  return [...list].sort((a,b)=>key(a)<key(b)?-1:key(a)>key(b)?1:0);
}
function buildFromState(){
  const mk=(list,kind)=>({count:null,items:list.map(it=>({
    title: kind==='face' ? (it.name.trim()||'(ยังไม่กรอกชื่อ)')
                         : 'ป้ายทะเบียนเลขที่ '+([it.plate.trim()||'-',it.prov.trim()].filter(Boolean).join(' ')),
    owner:it.owner.trim(), type:it.type.trim(), img:it._im||null,
    sightings:sortedSights(it.s).map(x=>({place:x.place.trim(),time:sightRaw(x)}))
  }))});
  const face=mk(S.face,'face'), lpr=mk(S.lpr,'lpr');
  return {
    reportDate:thaiDate(S.reportDate),
    range:{d1:thaiDate(S.start.d),t1:(S.start.t||'').replace(':','.'),d2:thaiDate(S.end.d),t2:(S.end.t||'').replace(':','.')},
    total:countEvents(face)+countEvents(lpr), face, lpr
  };
}
function formWarnings(){
  const w=[];
  const miss=reqEls.filter(e=>e.isConnected && !e.value.trim()).length;
  if(miss) w.push(`ยังกรอกไม่ครบ ${miss} ช่อง (ช่องที่ขอบสีแดง) – รูปจะแสดงเป็น “-” ในช่องนั้น`);
  const a=`${S.start.d}T${S.start.t}`, b=`${S.end.d}T${S.end.t}`;
  if(a>b) w.push('ช่วงเวลารายงานไม่ถูกต้อง: เวลาเริ่มต้นอยู่หลังเวลาสิ้นสุด');
  if(S.end.d && S.end.d!==S.reportDate) w.push(`วันที่รายงาน (${thaiDate(S.reportDate)}) ไม่ตรงกับวันสิ้นสุดช่วงเวลา (${thaiDate(S.end.d)})`);
  const seen={};
  [['ป้ายทะเบียน',S.lpr],['บุคคล',S.face]].forEach(([lab,list])=>list.forEach((it,i)=>{
    const key=(lab+'|'+(it.plate||it.name||'')+'|'+(it.prov||'')).replace(/\s+/g,'').toLowerCase();
    const nm=it.plate?`${it.plate} ${it.prov||''}`.trim():(it.name||'');
    if(nm){ if(seen[key]) w.push(`${lab} “${nm}” ถูกกรอกซ้ำ 2 รายการ – ถ้าเป็นคันเดียวกันให้รวมเป็นรายการเดียว แล้วเพิ่ม “การพบเหตุ”`); seen[key]=1; }
    it.s.forEach(x=>{
      if(x.d&&x.t){ const k=`${x.d}T${x.t}`; if(k<a||k>b) w.push(`${lab} ${nm||('รายการที่ '+(i+1))}: พบเหตุ ${timeShort(sightRaw(x))} อยู่นอกช่วงเวลารายงาน`); }
    });
  }));
  return [...new Set(w)];
}

/* ---------- สร้างฟอร์ม ---------- */
function h(tag,props={},...kids){
  const e=document.createElement(tag);
  for(const [k,v] of Object.entries(props)){
    if(k==='class') e.className=v; else if(k==='text') e.textContent=v;
    else if(k.startsWith('on')) e[k]=v; else e.setAttribute(k,v);
  }
  kids.flat().forEach(c=>{ if(c!=null) e.append(c.nodeType?c:document.createTextNode(c)); });
  return e;
}
function changed(){ saveDraft(); schedule(); }
function markBad(e){ e.classList.toggle('bad',!e.value.trim()); }
function inp(obj,key,o={}){
  const e=h('input',{type:o.type||'text',placeholder:o.ph||''});
  e.value=obj[key]||'';
  if(o.list) e.setAttribute('list',o.list);
  e.addEventListener('input',()=>{ obj[key]=e.value; if(o.req) markBad(e); if(o.after) o.after(); changed(); });
  if(o.list) e.addEventListener('change',()=>remember(o.list,e.value));
  if(o.req){ reqEls.push(e); markBad(e); }
  return e;
}
const fld=(label,el)=>h('label',{class:'f'},h('span',{text:label}),el);
function armed(btn,fn){
  const orig=btn.textContent; let on=false, tm;
  btn.onclick=()=>{
    if(!on){ on=true; btn.textContent='กดอีกครั้งเพื่อยืนยัน'; btn.classList.add('danger');
      tm=setTimeout(()=>{on=false;btn.textContent=orig;btn.classList.remove('danger');},3000); }
    else { clearTimeout(tm); fn(); }
  };
  return btn;
}
function rebuild(){
  const sc=$('paneForm'); const top=sc.scrollTop;
  buildForm(); sc.scrollTop=top; saveDraft(); render();
}

function sightRow(list,it,i){
  const x=it.s[i];
  const del=h('button',{class:'small',text:'ลบ'});
  del.onclick=()=>{ it.s.splice(i,1); rebuild(); };
  const r2=h('div',{class:'r2'},
    fld('วันที่พบ',inp(x,'d',{type:'date',req:true})),
    fld('เวลาที่พบ',inp(x,'t',{type:'time',req:true})),
    it.s.length>1 ? del : h('span'));
  return h('div',{class:'srow'},
    h('div',{class:'r1'},h('span',{class:'n',text:String(i+1)}),
      fld('จุดพบเหตุ',inp(x,'place',{list:'dl-place',ph:'เช่น สามแยกหน้าวัดเทพฯ',req:true}))),
    r2);
}
function downsize(file){
  return new Promise((res,rej)=>{
    const u=URL.createObjectURL(file), im=new Image();
    im.onload=()=>{
      const sc=Math.min(1,700/Math.max(im.width,im.height));
      const c=document.createElement('canvas'); c.width=Math.max(1,Math.round(im.width*sc)); c.height=Math.max(1,Math.round(im.height*sc));
      const g=c.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,c.width,c.height); g.drawImage(im,0,0,c.width,c.height);
      URL.revokeObjectURL(u); res(c.toDataURL('image/jpeg',0.88));
    };
    im.onerror=()=>{ URL.revokeObjectURL(u); rej(new Error('bad image')); };
    im.src=u;
  });
}
async function setItemImage(it,file){
  if(!file || !file.type.startsWith('image/')){ say('ไฟล์ที่เลือกไม่ใช่รูปภาพ'); return; }
  try{
    const url=await downsize(file);
    const im=new Image();
    im.onload=()=>{ it._url=url; it._im=im; rebuild(); say('ใส่รูปแล้ว'); };
    im.src=url;
  }catch(e){ say('อ่านรูปไม่ได้ ลองใช้รูปอื่น'); }
}
function imageFromClipboard(e){
  const cd=e.clipboardData; if(!cd) return null;
  let f=[...(cd.files||[])].find(x=>x.type.startsWith('image/'));
  if(!f) f=[...(cd.items||[])].filter(i=>i.kind==='file'&&i.type.startsWith('image/')).map(i=>i.getAsFile())[0];
  return f||null;
}
function photoBox(it,kind){
  const thumb = it._url ? h('img',{src:it._url,class:'thumb',alt:'รูปประกอบ'}) : h('div',{class:'ph',text:'ยังไม่มีรูป'});
  const fi=h('input',{type:'file',accept:'image/*'});
  fi.onchange=()=>{ if(fi.files[0]) setItemImage(it,fi.files[0]); };
  const pick=h('label',{class:'filebtn small'},it._url?'เปลี่ยนรูป':'เลือกไฟล์รูป',fi);
  const rm = it._url ? h('button',{class:'small',text:'ลบรูป'}) : null;
  if(rm) rm.onclick=()=>{ delete it._url; delete it._im; rebuild(); };
  const box=h('div',{class:'photo',tabindex:'0',title:'คลิกที่กรอบนี้แล้วกด Ctrl+V เพื่อวางรูป'},
    thumb,
    h('div',{class:'side'},
      h('div',{class:'tip',text:kind==='face'?'รูปประกอบ (ภาพคู่จากระบบหลัก) – คัดลอกรูป แล้วคลิกกรอบนี้กด Ctrl+V หรือลากไฟล์มาวาง':'รูปป้ายทะเบียน – คัดลอกรูป แล้วคลิกกรอบนี้กด Ctrl+V หรือลากไฟล์มาวาง'}),
      h('div',{class:'btns2'},pick,rm)));
  box.addEventListener('dragover',e=>{ e.preventDefault(); box.classList.add('drag'); });
  box.addEventListener('dragleave',()=>box.classList.remove('drag'));
  box.addEventListener('drop',e=>{ e.preventDefault(); box.classList.remove('drag'); const f=e.dataTransfer&&e.dataTransfer.files[0]; if(f) setItemImage(it,f); });
  return box;
}
function itemCard(kind,list,idx){
  const it=list[idx];
  const del=armed(h('button',{class:'small',text:'ลบรายการนี้'}),()=>{ list.splice(idx,1); rebuild(); });
  const head=h('div',{class:'ihead'},h('b',{text:kind==='face'?`บุคคลที่ ${idx+1}`:`ป้ายทะเบียนที่ ${idx+1}`}),del);
  const top = kind==='face'
    ? fld('ชื่อ-นามสกุล',inp(it,'name',{ph:'เช่น นางสาว ญาณภัทร รุ่งรัตน์พร',req:true}))
    : h('div',{class:'two'},
        fld('เลขทะเบียน',inp(it,'plate',{ph:'เช่น 1กก9125',req:true})),
        fld('จังหวัด',inp(it,'prov',{list:'dl-prov',req:true})));
  const addS=h('button',{class:'small',text:'+ เพิ่มการพบเหตุ (ครั้งถัดไป)'});
  addS.onclick=()=>{ it.s.push(newSight(it.s[it.s.length-1])); rebuild(); };
  const card=h('div',{class:'item'},head,top,photoBox(it,kind),
    h('div',{class:'three'},
      fld('เจ้าของคดี',inp(it,'owner',{list:'dl-owner',ph:'เช่น สภ.ถลาง',req:true})),
      fld('ประเภทคดี',inp(it,'type',{list:'dl-type',ph:'เช่น ลักทรัพย์',req:true}))),
    h('div',{class:'sbox'},h('div',{class:'lab',text:`การพบเหตุ (${it.s.length} ครั้ง)`}),
      it.s.map((_,i)=>sightRow(list,it,i)),addS));
  card.addEventListener('paste',e=>{ const f=imageFromClipboard(e); if(f){ e.preventDefault(); setItemImage(it,f); } });
  return card;
}
function section(kind,title,list){
  const n=list.reduce((a,it)=>a+Math.max(1,it.s.length),0);
  const add=h('button',{class:'small',text:kind==='face'?'+ เพิ่มบุคคล (Face ID)':'+ เพิ่มป้ายทะเบียน (LPR)'});
  add.onclick=()=>{ list.push(newItem(kind)); rebuild(); };
  return h('div',{class:'sec sec-'+kind},
    h('h3',{},h('span',{text:title}),h('span',{class:'cnt',text:n+' เหตุการณ์'})),
    list.length?list.map((_,i)=>itemCard(kind,list,i)):h('div',{class:'note',text:'ไม่มีเหตุการณ์ (ถ้าไม่มี ไม่ต้องกดเพิ่ม)'}),
    add);
}
function buildForm(){
  reqEls=[];
  const root=$('form'); root.innerHTML='';
  const rd=inp(S,'reportDate',{type:'date',req:true});
  rd.addEventListener('change',()=>{
    if(!S.reportDate) return;
    S.end.d=S.reportDate; S.start.d=addDays(S.reportDate,-1); rebuild();
  });
  const info=h('div',{class:'sec sec-info'},h('h3',{},h('span',{text:'ข้อมูลรายงาน'})),
    fld('วันที่รายงาน',rd),
    h('div',{class:'note',text:'เมื่อเปลี่ยนวันที่รายงาน ระบบจะตั้งช่วงเวลาเป็น “เมื่อวาน 08:30 ถึง วันนี้ 09:30” ให้ใหม่ (แก้เองได้ เช่น วันจันทร์ให้เริ่มจากวันศุกร์)'}),
    h('div',{class:'three'},
      fld('ตั้งแต่วันที่',inp(S.start,'d',{type:'date',req:true})),
      fld('เวลา',inp(S.start,'t',{type:'time',req:true}))),
    h('div',{class:'three'},
      fld('ถึงวันที่',inp(S.end,'d',{type:'date',req:true})),
      fld('เวลา',inp(S.end,'t',{type:'time',req:true}))));
  const reset=armed(h('button',{text:'เริ่มรายงานใหม่ (ล้างทั้งหมด)'}),()=>{ S=newState(); rebuild(); });
  root.append(titleSection(),info,section('face','ระบบตรวจจับใบหน้า (Face ID)',S.face),section('lpr','ระบบตรวจจับป้ายทะเบียน (LPR)',S.lpr),h('div',{class:'btns'},reset));
}

/* ==================================================
   รับข้อมูล VSS05 จาก React
================================================== */

function loadImageFromDataUrl(
  item,
  dataUrl
) {

  return new Promise(
    (resolve) => {

      if (!dataUrl) {
        resolve();
        return;
      }

      const im =
        new Image();

      im.onload = () => {

        item._url =
          dataUrl;

        item._im =
          im;

        resolve();
      };

      im.onerror = () => {
        resolve();
      };

      im.src =
        dataUrl;
    }
  );
}


window.addEventListener(
  'message',
  async (event) => {

    /*
     * รับเฉพาะเว็บเดียวกัน
     */
    if (
      event.origin !==
      window.location.origin
    ) {
      return;
    }


    const message =
      event.data;


    if (
      !message ||
      message.type !==
        'LOAD_VSS05_DATA'
    ) {
      return;
    }


    const data =
      message.payload || {};


    const incomingLpr =
      Array.isArray(data.lpr)
        ? data.lpr
        : [];


    /*
     * สร้าง State ใหม่
     */
    S = {

      reportDate:
        data.reportDate ||
        isoOf(new Date()),


      start: {

        d:
          data.start?.d ||
          data.reportDate ||
          isoOf(new Date()),

        t:
          data.start?.t || '',
      },


      end: {

        d:
          data.end?.d ||
          data.reportDate ||
          isoOf(new Date()),

        t:
          data.end?.t || '',
      },


      face: [],


      lpr:
        incomingLpr.map(
          (item) => ({

            plate:
              item.plate || '',

            prov:
              item.prov || '',

            owner:
              item.owner || '',

            type:
              item.type || '',

            s:
              Array.isArray(item.s) &&
              item.s.length
                ? item.s.map(
                    (sight) => ({

                      place:
                        sight.place ||
                        '',

                      d:
                        sight.d ||
                        '',

                      t:
                        sight.t ||
                        '',
                    })
                  )
                : [
                    {
                      place: '',
                      d:
                        data.end?.d ||
                        data.reportDate ||
                        '',
                      t: '',
                    },
                  ],
          })
        ),


      savedAt:
        Date.now(),
    };


    /*
     * ใส่รูป Thumbnail
     */
    await Promise.all(

      S.lpr.map(
        async (
          item,
          index
        ) => {

          const imageDataUrl =
            incomingLpr[
              index
            ]?.imageDataUrl;

          if (!imageDataUrl) {
            return;
          }

          await loadImageFromDataUrl(
            item,
            imageDataUrl
          );
        }
      )
    );


    /*
     * สร้างฟอร์ม +
     * Preview ใหม่
     */
    rebuild();


    const imageCount =
      incomingLpr.filter(
        (item) =>
          item.imageDataUrl
      ).length;


    say(
      `รับข้อมูล VSS05 แล้ว ${S.lpr.length} คัน` +
      (
        imageCount
          ? ` • พบภาพ ${imageCount} คัน`
          : ''
      )
    );
  }
);
